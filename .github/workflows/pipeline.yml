name: Pipeline & API

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/**'
      - 'api/**'
      - '.github/workflows/pipeline.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pipeline/**'
      - 'api/**'
      - '.github/workflows/pipeline.yml'
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [pipeline, api]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: 'latest'
          enable-cache: true
          cache-dependency-glob: '${{ matrix.project }}/uv.lock'

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        # --extra dev: pytest and ruff live in the dev extra, not the runtime deps.
        run: uv sync --extra dev

      - name: Lint
        working-directory: ${{ matrix.project }}
        # Lint only, matching `make lint-*`. `ruff format --check` is not enforced:
        # the tree predates any formatter run. See the note in the Makefile.
        run: uv run --extra dev ruff check src tests

      - name: Test
        working-directory: ${{ matrix.project }}
        # Live tests are opt-in via STERISH_LIVE_TESTS and stay skipped here: CI has
        # no keys and must not depend on testnet being reachable.
        run: uv run --extra dev pytest tests/ -v
