name: Contracts

# The gate guards itself: changes to scripts/, the Makefile, the pinned
# toolchain or this workflow re-run the whole thing.
on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'scripts/**'
      - 'Makefile'
      - 'rust-toolchain.toml'
      - '.github/workflows/contracts.yml'
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'scripts/**'
      - 'Makefile'
      - 'rust-toolchain.toml'
      - '.github/workflows/contracts.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same version as rust-toolchain.toml. Stated explicitly so a mismatch
      # between the two is visible in the log instead of silently re-resolving.
      - name: Install Rust 1.93.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93.0'
          targets: wasm32v1-none
          components: llvm-tools-preview, clippy, rustfmt

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # Needed by verify-soulbound.sh, which reads the contract spec back out of
      # the built wasm.
      #
      # Installed from the released binary rather than `cargo install stellar-cli`.
      # Building it from source pulls in libdbus-sys, whose build script needs
      # libdbus-1-dev; that package is not on the runner, so this step panicked and
      # every Contracts run had been red since 2026-09-03. The binary is the same
      # pinned 27.0.0 and skips several minutes of compilation.
      - name: Install stellar-cli 27.0.0
        run: |
          set -euo pipefail
          curl -sSLf -o /tmp/stellar-cli.tar.gz \
            https://github.com/stellar/stellar-cli/releases/download/v27.0.0/stellar-cli-27.0.0-x86_64-unknown-linux-gnu.tar.gz
          sudo tar -xzf /tmp/stellar-cli.tar.gz -C /usr/local/bin stellar
          stellar --version

      - name: Format check
        working-directory: contracts
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: contracts
        run: cargo clippy --all-targets -- -D warnings

      # 133 per-contract unit tests + the cross-contract integration suite in
      # contracts/tests.
      - name: Run contract tests
        working-directory: contracts
        run: cargo test

      # Two things happen here, both on purpose:
      #   1. the numbers are PRINTED, in the log and on the PR summary page, so
      #      a third party can read the coverage without asking anyone;
      #   2. the job goes RED below 80% line coverage. This is an enforced gate,
      #      not a report.
      - name: Coverage (printed + enforced >= 80% lines)
        working-directory: contracts
        run: |
          set -euo pipefail
          cargo llvm-cov --workspace --summary-only | tee "$RUNNER_TEMP/coverage.txt"
          {
            echo '## Contract coverage (cargo llvm-cov --workspace)'
            echo
            echo '```'
            awk '/^Filename/{p=1} p' "$RUNNER_TEMP/coverage.txt"
            echo '```'
            echo
            echo 'Gate: `--fail-under-lines 80`'
          } >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov --workspace --fail-under-lines 80

      # Compile check for every workspace member against the deploy target,
      # including the test-only crate.
      - name: Check WASM build
        working-directory: contracts
        run: cargo build --target wasm32v1-none --release

      # STE-11: proves the badge and the licence are soulbound by ABI shape —
      # no transfer/approve/burn entrypoint is exported by the built wasm.
      - name: Verify soulbound ABI
        run: bash scripts/verify-soulbound.sh

      # The wasm-hashes job below verifies one host per matrix leg. A host
      # recorded in the manifest with no leg to check it would go stale without
      # anyone noticing — the same silent-rot problem the hash gate exists to
      # prevent — so the two sets must match exactly, both ways.
      - name: Every recorded host is verified by this workflow
        run: |
          set -euo pipefail
          recorded="$(grep -v '^#' contracts/wasm-hashes.txt | awk 'NF {print $5}' | sort -u)"
          verified="$(awk '/^[[:space:]]*-[[:space:]]*host:[[:space:]]/{print $3}' \
                      .github/workflows/contracts.yml | sort -u)"
          echo "recorded in contracts/wasm-hashes.txt:"; echo "$recorded" | sed 's/^/  /'
          echo "verified by the wasm-hashes matrix:";    echo "$verified" | sed 's/^/  /'
          [ -n "$recorded" ] || { echo "::error::no host rows found in the manifest"; exit 1; }
          [ -n "$verified" ] || { echo "::error::no matrix hosts parsed from this workflow"; exit 1; }
          if [ "$recorded" != "$verified" ]; then
            echo "::error::the manifest and the wasm-hashes matrix disagree about hosts"
            comm -23 <(echo "$recorded") <(echo "$verified") \
              | sed 's/^/  recorded but never verified: /'
            comm -13 <(echo "$recorded") <(echo "$verified") \
              | sed 's/^/  verified but not recorded:  /'
            exit 1
          fi
          echo "ok: every recorded host has a matrix leg that verifies it"

  # STE-12: rebuild the three contracts and fail if any artifact drifted from
  # the sha256 recorded in contracts/wasm-hashes.txt.
  #
  # This runs on THREE hosts on purpose, because the host is part of the artifact
  # identity. A Soroban wasm build is byte-reproducible for a given host triple
  # and NOT across host triples: same commit, same pinned rustc 1.93.0, same
  # Cargo.lock, same profile, same path remapping, yet the linker lays the
  # read-only data symbols out in a different order on each host, which shifts
  # the pointer constants in the code section. Section sizes stay identical —
  # which is exactly what the 8 red runs showed: same size, different sha256.
  #
  #   macos-15         aarch64-apple-darwin       <- the bytes LIVE ON TESTNET.
  #                    This leg is what makes docs/deployments.md checkable by a
  #                    third party: it rebuilds the deployed contracts from
  #                    source and proves the sha256 still matches what is on
  #                    chain.
  #   ubuntu-latest    x86_64-unknown-linux-gnu   <- ordinary drift (source,
  #                    Cargo.lock, profile, toolchain) on the cheap runner.
  #   ubuntu-24.04-arm aarch64-unknown-linux-gnu  <- same, for the third host the
  #                    manifest records.
  #
  # There is one leg per recorded host, and the `test` job fails if that stops
  # being true. A recorded row that nothing verifies would rot silently, which
  # is the same defect this ticket exists to fix.
  #
  # No leg can be made green by editing another's rows, so the manifest cannot
  # be quietly rewritten to match whatever a runner happens to produce.
  wasm-hashes:
    name: Verify wasm hashes (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        # `host` is deliberately the first key of each entry: the "every
        # recorded host is verified" step below greps these lines, and that
        # check is only as trustworthy as its parse.
        include:
          - host: aarch64-apple-darwin
            os: macos-15
          - host: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - host: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.93.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93.0'
          targets: wasm32v1-none

      # Fail loudly if the runner is not the host this leg claims to verify,
      # rather than letting build-wasm.sh report a confusing hash mismatch.
      - name: Confirm host triple
        run: |
          set -euo pipefail
          actual="$(rustc -vV | awk '/^host: /{print $2}')"
          echo "host: $actual"
          [ "$actual" = "${{ matrix.host }}" ] || {
            echo "::error::runner host is $actual, expected ${{ matrix.host }}"
            exit 1
          }

      # build-wasm.sh reads the entrypoint count back out of each wasm with
      # `stellar contract info interface`.
      - name: Install stellar-cli 27.0.0
        run: |
          set -euo pipefail
          curl -sSLf -o /tmp/stellar-cli.tar.gz \
            "https://github.com/stellar/stellar-cli/releases/download/v27.0.0/stellar-cli-27.0.0-${{ matrix.host }}.tar.gz"
          sudo tar -xzf /tmp/stellar-cli.tar.gz -C /usr/local/bin stellar
          stellar --version

      - name: Verify wasm hashes
        run: bash scripts/build-wasm.sh --check

      - name: Upload wasm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sterish-contracts-wasm-${{ matrix.host }}
          path: |
            contracts/target/wasm32v1-none/release/sterish_registry.wasm
            contracts/target/wasm32v1-none/release/sterish_escrow.wasm
            contracts/target/wasm32v1-none/release/sterish_tokens.wasm
            contracts/wasm-hashes.txt
          if-no-files-found: error
