[project]
name = "sterish-api"
version = "0.1.0"
description = "Verification REST API for Sterish audited skill marketplace"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "stellar-sdk>=13.0",
    "pydantic>=2.0",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sterish_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Same rule set as pipeline/pyproject.toml so one repo lints one way.
select = ["E", "F", "W", "I", "UP", "B"]
