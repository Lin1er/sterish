[project]
name = "sterish-api"
version = "0.1.0"
description = "Verification REST API for Sterish audited skill marketplace"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.0",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sterish_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]