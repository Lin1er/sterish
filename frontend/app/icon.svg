<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Sterish">
  <!--
    STE-7. The inner viewBox crops to the lens rather than showing the whole
    mark. The mark is a 5.2:1 band, so framing all of it in a square left the
    artwork about 26% of the height: legible in the 512 source, a smudge at the
    16px a browser tab actually renders.

    The crop is measured, not eyeballed. In the mark's own 400x400 space the
    navy lens occupies 109.5 x 77.2 at (129.0, 161.4), centre (183.75, 200.0).
    The window here is the square that makes the lens 40% of its width.

    That 40% is looser than the 55% used by sterish-avatar-navy-tight-1024.png,
    and deliberately so: the avatar is cropped to a CIRCLE, which eats the
    corners, so it needs more fill to look right. This badge keeps its corners,
    and at 55% the lens ran off the right edge. Candidates at 34, 40, 46 and 55
    percent were rendered at 16, 32 and 48px before picking this one.

    Regenerate both together if the mark artwork ever changes.
  -->
  <rect width="512" height="512" rx="112" fill="#122C4F"/>
