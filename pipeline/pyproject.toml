[project]
name = "sterish-pipeline"
version = "0.1.0"
description = "LLM-based audit pipeline for AI agent skills"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "stellar-sdk>=13.0",
    "rich>=13.0",
    "click>=8.0",
]

[project.optional-dependencies]
sandbox = ["docker>=7.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sterish_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
