[project]
name = "sterish-pipeline"
version = "0.1.0"
description = "Audit pipeline for AI agent skills"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "stellar-sdk>=13.0",
    "rich>=13.0",
    "click>=8.0",
]

[project.optional-dependencies]
sandbox = ["docker>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sterish_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]
