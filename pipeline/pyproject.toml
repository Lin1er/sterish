[project]
name = "sterish-pipeline"
version = "0.1.0"
description = "LLM-based audit pipeline for AI agent skills"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "stellar-sdk>=13.0",
    "rich>=13.0",
    "click>=8.0",
]

# The CLI had no console-script entry point, so `sterish audit ...` did not exist.
[project.scripts]
sterish = "sterish_pipeline.cli:main"

[project.optional-dependencies]
sandbox = ["docker>=7.0"]
# Stage 3 LLM synthesis. Deliberately OPTIONAL: sterish_pipeline.llm imports anthropic
# lazily and fails soft, so the whole pipeline runs -- and the whole test suite passes --
# on an install that does not have it.
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sterish_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
