[package]
name = "sterish-tokens"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Test-only: the REAL SkillRegistry is deployed in-test so the `Safe`-verdict gate
# is exercised against the production contract, not a hand-written mock. It is a
# dev-dependency on purpose — a normal dependency would compile the whole registry
# into sterish_tokens.wasm. Production code reaches the registry through the
# `RegistryClient` generated by `#[contractclient]` in `data.rs`.
sterish-registry = { path = "../registry" }
